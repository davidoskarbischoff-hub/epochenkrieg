<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konzept B – Minimal, Seitenleiste</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ===== Variante B: Chips oben links, Knöpfe oben rechts, Seitenleiste nur bei Auswahl, Berater als Sprechblase ===== */
#chips{position:absolute;left:calc(8px*var(--s));top:calc(8px*var(--s));display:flex;gap:calc(5px*var(--s));flex-wrap:wrap;max-width:calc(100% - 330px*var(--s));z-index:10}
.chip{display:flex;align-items:center;gap:calc(4px*var(--s));height:calc(34px*var(--s));padding:0 calc(10px*var(--s)) 0 calc(5px*var(--s));border-radius:99px;position:relative;white-space:nowrap}
.chip::before{content:"";position:absolute;inset:calc(-5px*var(--s)) -2px} /* unsichtbare Trefferfläche: 44 px */
.chip img{width:calc(26px*var(--s));height:calc(26px*var(--s))}
.chip b{font:600 1.02em var(--f-ui);font-variant-numeric:tabular-nums}
.chip.ep{padding:0 calc(14px*var(--s));background:color-mix(in srgb,var(--fr) 30%,rgba(var(--tint),.5))}
.chip.ep b{font:400 1.1em var(--f-h);color:#fff;letter-spacing:.02em}
.chip.ep small{font-size:.68em;color:var(--warn);margin-left:4px}
#btns{position:absolute;right:calc(8px*var(--s));top:calc(8px*var(--s));display:flex;gap:calc(6px*var(--s));z-index:11}
.rb{width:calc(44px*var(--s));height:calc(44px*var(--s));border-radius:50%;display:grid;place-items:center;position:relative;font-size:1.1em;padding:0;color:var(--ink)}
.rb .n{position:absolute;right:-3px;top:-3px;min-width:1.55em;height:1.55em;border-radius:99px;background:var(--bad);font-size:.7em;font-weight:700;display:grid;place-items:center;border:1px solid rgba(0,0,0,.4)}
.rb img{width:calc(42px*var(--s));height:calc(42px*var(--s));margin:-4px}
/* Seitenleiste rechts, nur bei Auswahl; Höhe richtet sich nach Inhalt */
#side{position:absolute;right:calc(8px*var(--s));top:calc(62px*var(--s));width:calc(292px*var(--s));max-height:calc(100% - 76px*var(--s));overflow:auto;padding:calc(12px*var(--s));z-index:10}
.hd{display:flex;gap:calc(10px*var(--s));align-items:center;margin-bottom:calc(8px*var(--s))}
.hd>img{width:calc(64px*var(--s));height:calc(64px*var(--s));object-fit:contain;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid color-mix(in srgb,var(--fr) 35%,transparent);padding:3px}
.hd h2{margin:0;font:400 1.45em/1.05 var(--f-h);color:var(--fr)}
.hd .sub{font-size:.72em;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.hd .x{margin-left:auto;align-self:flex-start;width:calc(44px*var(--s));height:calc(44px*var(--s));border:0;background:none;color:var(--ink2);font-size:1.1em;margin:calc(-8px*var(--s)) calc(-8px*var(--s)) 0 auto}
.hpl{display:flex;align-items:center;gap:6px;font-size:.78em;margin-bottom:8px}.hpl .bar{flex:1}
#side p{margin:0 0 10px;font-size:.88em;color:var(--ink2);line-height:1.3}
.al{display:flex;flex-direction:column;gap:calc(6px*var(--s))}
.row{position:relative;display:flex;align-items:center;gap:calc(10px*var(--s));min-height:calc(60px*var(--s));padding:calc(4px*var(--s)) calc(8px*var(--s));border-radius:calc(10px*var(--s));border:1px solid rgba(255,255,255,.13);background:linear-gradient(rgba(255,255,255,.08),rgba(0,0,0,.2));text-align:left;width:100%}
.row:hover{border-color:var(--fr);background:linear-gradient(color-mix(in srgb,var(--fr) 24%,transparent),rgba(0,0,0,.2))}
.row>img{width:calc(46px*var(--s));height:calc(46px*var(--s));object-fit:contain;flex:none}
.row .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .nm{font-weight:600;font-size:.98em;line-height:1.05}
.row .cs{display:flex;gap:7px;flex-wrap:wrap}
.row .hot{position:absolute;right:6px;top:5px}
/* Mini-Karte unten links (immer da), Berater-Sprechblase darüber */
#mapc{position:absolute;left:calc(8px*var(--s));bottom:calc(8px*var(--s));width:calc(168px*var(--s));height:calc(126px*var(--s));padding:calc(4px*var(--s));z-index:10}
#bub{position:absolute;left:calc(8px*var(--s));bottom:calc(146px*var(--s));width:calc(300px*var(--s));padding:calc(10px*var(--s)) calc(12px*var(--s));border-radius:calc(14px*var(--s)) calc(14px*var(--s)) calc(14px*var(--s)) 4px;z-index:10;display:flex;gap:calc(8px*var(--s));align-items:center}
#bub .av{flex:none;width:calc(34px*var(--s));height:calc(34px*var(--s));border-radius:50%;background:color-mix(in srgb,var(--fr) 40%,#000);display:grid;place-items:center;color:#fff;font-size:1.1em}
#bub p{margin:0;font-size:.92em;line-height:1.2;flex:1}
#bub .yn{width:calc(44px*var(--s));height:calc(44px*var(--s));border:0;border-radius:50%;background:rgba(255,255,255,.07);font-size:1.15em;font-weight:700;flex:none}
#bub .yes{color:var(--good)}#bub .no{color:var(--bad)}
</style></head>
<body>
<div id="bg"></div>
<div id="chips"></div>
<div id="btns"></div>
<aside id="side" class="glass"></aside>
<div id="bub" class="glass"></div>
<div id="mapc" class="glass"><div class="mm"></div></div>
<div class="menuov" id="mn"><div class="win glass"><h3>Menü</h3><div class="tabs"><b class="on">Spiel</b><b>Grafik</b><b>Ton</b><b>Steuerung</b></div>
 <div class="row" style="min-height:calc(44px*var(--s));background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);border-radius:0"><span>Berater</span><i class="sw" style="margin-left:auto"></i></div><div class="row" style="min-height:calc(44px*var(--s));background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);border-radius:0"><span>Arbeiter denken mit</span><i class="sw" style="margin-left:auto"></i></div><div class="row" style="min-height:calc(44px*var(--s));background:none;border:0;border-radius:0"><span>Zurück zum Spiel</span><b style="margin-left:auto">Esc</b></div></div></div>
<div class="tip">Konzept B · Minimal mit Seitenleiste</div>
<script src="shared.js"></script>
<script>
document.getElementById('chips').innerHTML=`<div class="chip glass ep"><b>${EPN}</b>${EP===0?'<small>14/14</small>':''}</div>`+RES.map(r=>`<div class="chip glass" title="${r[1]}"><img src="${I(r[0])}" alt=""><b>${r[2]}</b></div>`).join('');
document.getElementById('btns').innerHTML=`<button class="rb glass" title="Untätige Arbeiter (.)">${img('unit-worker')}<span class="n">14</span></button><button class="rb glass" title="Zeitalter-Baum (T)">${TREE}</button><button class="rb glass" title="Pause">❚❚</button><button class="rb glass" title="Tempo">1×</button><button class="rb glass" title="Menü (Esc)">☰</button>`;
const side=document.getElementById('side');
if(S){
 side.innerHTML=`<div class="hd">${img(S.img)}<div><h2>${S.name}</h2><div class="sub">${S.sub}</div></div><button class="x">✕</button></div><div class="hpl"><div class="bar"><i style="width:100%"></i></div>${S.hp[0]} / ${S.hp[1]}</div><p>${S.text}</p><div class="al">${S.acts.map(a=>`<button class="row"><span class="hot">${a[3]}</span>${img(a[1])}<span class="tx"><span class="nm">${a[0]}</span><span class="cs">${costHtml(a[2])||'&nbsp;'}</span></span></button>`).join('')}</div>`;
}else side.hidden=true;
const bub=document.getElementById('bub');
if(ADV)bub.innerHTML=`<span class="av">★</span><p>Baue eine Hütte, damit mehr Arbeiter Platz haben <span class="co"><img src="${I('res-wood')}">60</span></p><button class="yn yes" title="Annehmen (Y)">✓</button><button class="yn no" title="Ablehnen (X)">✕</button>`;else bub.hidden=true;
if(MENU)document.getElementById('mn').classList.add('on');
</script></body></html>
