<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Epochenkrieg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23332a1f%27/%3E%3Cpath d=%27M3 13L8 3l5 10z%27 fill=%27%23c08a4a%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">Epochenkrieg</div>
    <div class="res" data-tt="Nahrung" title="Nahrung"><span class="icn" data-ic="food"></span><b id="v-food">0</b><small data-t="Nahrung">Nahrung</small></div>
    <div class="res" data-tt="Holz" title="Holz"><span class="icn" data-ic="wood"></span><b id="v-wood">0</b><small data-t="Holz">Holz</small></div>
    <div class="res" data-tt="Stein" title="Stein"><span class="icn" data-ic="stone"></span><b id="v-stone">0</b><small data-t="Stein">Stein</small></div>
    <div class="res" id="res-gold" data-tt="Gold" title="Gold" hidden><span class="icn" data-ic="gold"></span><b id="v-gold">0</b><small data-t="Gold">Gold</small></div>
    <div class="res" id="res-iron" data-tt="Eisen" title="Eisen" hidden><span class="icn" data-ic="iron"></span><b id="v-iron">0</b><small data-t="Eisen">Eisen</small></div>
    <div class="res" data-tt="Bevölkerung" title="Bevölkerung"><span class="icn" data-ic="pop"></span><b id="v-pop">0</b><small data-t="Bevölkerung">Bevölkerung</small></div>
    <div class="res" id="res-wk" data-tt="Arbeiter (F1) – für den Aufstieg nötig" title="Arbeiter (F1) – für den Aufstieg nötig"><span class="icn">⛏</span><b id="v-wk">0</b></div>
    <div class="res" data-tt="Truppen (F2 Land, F4 Wasser)" title="Truppen (F2 Land, F4 Wasser)"><span class="icn">⚔</span><b id="v-troop">0</b></div>
    <div id="epoch">Steinzeit</div>
    <div class="spacer"></div>
    <button class="tbtn idle ok" id="idleBtn" data-tt="Untätigen Arbeiter auswählen (.)" title="Untätigen Arbeiter auswählen (.)">Alle Arbeiter beschäftigt</button>
    <button class="tbtn" id="pauseBtn">Pause</button>
    <button class="tbtn" id="speedBtn" data-tt="Spieltempo" title="Spieltempo">Tempo 1×</button>
    <button class="tbtn" id="menuBtn" data-tt="Menü (Esc)" title="Menü (Esc)"><span data-t="Menü">Menü</span> ☰</button>
  </header>
  <main id="view">
    <canvas id="gl"></canvas>
    <canvas id="c" aria-label="Spielkarte"></canvas>
    <div id="upgbar" hidden><span></span><div><i></i></div></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="advisor" hidden></div>
    <div id="hint" hidden></div>
    <div id="overlay"></div>
    <div id="fps" hidden></div>
    <div id="menu" hidden></div>
  </main>
  <footer id="panel">
    <section id="info"></section>
    <section id="acts"></section>
    <canvas id="mini" aria-label="Minikarte"></canvas>
  </footer>
</div>
<script src="js/data.js"></script>
<script src="js/settings.js"></script>
<script src="js/nav.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/models3d.js"></script>
<script src="js/render3d.js"></script>
<script src="js/net.js"></script>
<script src="js/state.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/commands.js"></script>
<script src="js/input.js"></script>
<script src="js/mp.js"></script>
<script src="js/advisor.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
