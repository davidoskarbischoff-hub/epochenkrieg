# Schnelle Prüfung bei jedem Push/Pull Request: Sind alle JavaScript-Dateien des Spiels (Web-Version) und der App syntaktisch in Ordnung?
name: Prüfung
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript prüfen
        run: |
          fail=0
          for f in js/*.js desktop/*.js desktop/scripts/*.js; do node --check "$f" || fail=1; done
          exit $fail
